#-------------------------------------------
#
# Title: tmux config (Zsh version)
# Author: Aaron J. Griffith
# Purpose: Better your command line
#
# Created: 2014
# Updated: 2017, 2023, 2025, 2026
#
# Additional Information: PREFIX is Ctrl+b
#
# Required files:
#  - clssh.sh - Cluster SSH (ensure it exists at ~/clssh.sh)
#-----------------------------------------------------

# ── TPM Plugin Manager ──────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'jabirali/tmux-tilit'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# ── Plugin Options ──────────────────────────
# Catppuccin theme (macchiato)
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

# tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-fzf
set -g @tmux-fzf-options '-p -w 62% -h 38% -m'

# vim-tmux-navigator (pane switching without prefix)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# ── Terminal & Shell ────────────────────────
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -sa terminal-overrides ',screen-256color:RGB'

set-option -g default-shell /bin/zsh

# ── General Behaviour ───────────────────────
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2000
setw -g monitor-activity on
set -g mouse on
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
set-option -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on

# ── Catppuccin Status Bar ───────────────────
set -g @sync_on '#[fg=#c6a0f6]#[fg=#181926,bg=#c6a0f6]󰓦 #[fg=#cad3f5,bg=#363a4f] SYNC #[fg=#363a4f]'
set -g status-left "#{?pane_synchronized,#{@sync_on},}#{E:@catppuccin_status_session} #{E:@catppuccin_status_directory}"
set -g status-right "#{E:@catppuccin_status_user}@#{E:@catppuccin_status_host} #{E:@catppuccin_status_date_time}"
set -g status-left-length 100
set -g status-right-length 100
set-option -g status-interval 2
set -g focus-events on
setw -g aggressive-resize on

# ── Key Bindings ────────────────────────────
bind / command-prompt -p "Man Page:" "split-window -h 'exec man %%'"
unbind-key t
bind-key -n C-t command-prompt -p "SSH:" "new-window -n %1 'ssh %1'"
unbind-key e
bind-key -n C-e command-prompt -p "Cluster SSH:" "new-window 'exec sh ~/clssh.sh %%'"
unbind-key %
bind-key | split-window -h
bind-key - split-window -v
bind-key -n C-p paste-buffer
bind-key -n M-Right next-window
bind-key -n M-Left previous-window
bind-key a setw synchronize-panes \; display "Pane Synchronize: #{?pane_synchronized,Enabled,Disabled}"
bind-key -n F9 command-prompt "rename-window %%"

# tmux-fzf launcher (Ctrl-f)
bind-key -n C-f run-shell -b ~/.tmux/plugins/tmux-fzf/main.sh

# reload config
unbind-key -T prefix r
bind-key -T prefix r source-file ~/.tmux.conf \; display "Reloaded tmux Config"

bind-key -n C-g command-prompt -p "ShellGen:" "split-window -v 'sh ~/shellgen.sh %%'"

# ── TPM Bootstrap (must be last) ────────────
run '~/.tmux/plugins/tmux/catppuccin.tmux'
run '~/.tmux/plugins/tpm/tpm'
