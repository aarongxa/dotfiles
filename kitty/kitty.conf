# Font settings
font_family              Hack Nerd Font Mono
font_size                11.0

# Enable ligatures (calt=1 in Ghostty)
font_features            Hack Nerd Font Mono +calt

# Slight thickening of thin strokes
bold_font                auto
adjust_font_rendering    true

# 10 % extra cell height
adjust_cell_height       0 0 10%

# Background opacity and blur — reduced strength
background_opacity       0.9
background_blur          16

# Cursor
cursor                   #f8f8f2
cursor_text_color        #282a36
cursor_shape             block
cursor_blink             no
cursor_beam_thickness    2

# Selection colors
selection_foreground     #f8f8f2
selection_background     #44475a

# Hide mouse cursor while typing
mouse_hide_wait          3.0

# Clipboard access
clipboard_control        read-clipboard write-clipboard read-permission write-permission

# Custom very dark background
background               #0B0C0C

# Dracula foreground and palette
foreground               #f8f8f2

color0                   #21222c
color1                   #ff5555
color2                   #50fa7b
color3                   #f1fa8c
color4                   #bd93f9
color5                   #ff79c6
color6                   #8be9fd
color7                   #f8f8f2

color8                   #6272a4
color9                   #ff6e6e
color10                  #69ff94
color11                  #ffffa5
color12                  #d6acff
color13                  #ff92df
color14                  #a4ffff
color15                  #ffffff

# Optional
allow_remote_control     yes
# Use kitty's native terminfo for best compatibility
# term                     xterm-256color  # DISABLED - causes PS1/prompt issues
# Let kitty use its default (xterm-kitty) or let .zshenv handle it

# Hide title bar on macOS
hide_window_decorations   no

# Quake-style terminal settings
remember_window_size     no
initial_window_width     100c
initial_window_height    30c

# Window placement (top of screen)
# Use with: kitty --class quake-kitty --start-as fullscreen
# Or with window manager keybindings

# Keyboard shortcuts for Quake-style behavior
# Toggle window focus (use with OS hotkey manager)
## [macOS-only] map cmd+` toggle_macos_window_focus

# Quick hide/show with cmd+shift+escape
## [macOS-only] map cmd+shift+escape hide_macos_app

# Startup mode for Quake window
# startup_session quake.session

# Window padding for better visibility
window_padding_width     4

# Tab bar (useful for Quake terminal)
tab_bar_edge             top
tab_bar_style            powerline
tab_powerline_style      slanted
